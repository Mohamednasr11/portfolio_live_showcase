  <style>
    body {
      margin: 0;
      background: #070A12;
      color: #F4F7FB;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #070A12;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loading.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .spinner-container {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(34, 211, 238, 0.15);
      border-top-color: #22D3EE;
      border-right-color: #06B6D4;
      animation: spin 0.85s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.25);
    }
    .logo-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-size: 16px;
      color: #22D3EE;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: #F4F7FB;
    }
    p {
      font-size: 13px;
      color: #B8C2D6;
      margin: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .seo-fallback {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() { loader.remove(); }, 400);
      }
    });

    // Fail-safe fallback timer in case first-frame event takes too long
    setTimeout(function() {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() { if (loader && loader.parentNode) loader.remove(); }, 400);
      }
    }, 4000);
  </script>
