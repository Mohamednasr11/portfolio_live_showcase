name: Flutter CI

on:
  push:
    branches: [master, main, "portfolio/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build web release
        run: flutter build web --release --output build/web-release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-release
          path: build/web-release/
          if-no-files-found: error
